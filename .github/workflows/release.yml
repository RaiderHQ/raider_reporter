name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  id-token: write # RubyGems trusted publishing (OIDC)
  contents: write # rubygems/release-gem tags and creates the GitHub release assets

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'RaiderHQ'
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/raider_reporter
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
