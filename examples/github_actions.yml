# Add to your workflow after setting the RAIDER_TOKEN secret (Project settings → API tokens).
- name: Run tests
  env:
    RAIDER_TOKEN: ${{ secrets.RAIDER_TOKEN }}
    RAIDER_ENDPOINT: ${{ vars.RAIDER_ENDPOINT }}
    RAIDER_QUARANTINE: "1"
  run: bundle exec raider-reporter exec -- bundle exec rspec spec --format documentation
- name: Keep local results
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: raider-results
    path: raider-results/
